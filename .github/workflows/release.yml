name: Release

# Builds and publishes a GitHub release for tags like v2026.11.0 or v2026.11.0-rc1 (a prerelease).
# Tag filters are globs, so the exact format is checked in the first step.
on:
  push:
    tags: ["v[0-9]*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # Ubuntu 22.04, like the elodisco server: the binaries link its glibc and OpenSSL.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check tag format
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG doesn't look like v2026.11.0 or v2026.11.0-suffix"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config zip
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace
      - name: Build binaries
        run: cargo build --release --bin eloelo --bin elodisco
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Build UI
        working-directory: ./ui
        run: npm install && npm run build
      - name: Pack dota-agent
        run: ./deploy-dota-agent.sh
      - name: Package
        # eloelo finds ui/dist and dota-ocr-engine relative to its working directory, so the
        # archive is meant to be run from where it's extracted.
        run: |
          name=eloelo-$TAG-linux-x86_64
          mkdir -p dist/$name/ui
          cp target/release/eloelo target/release/elodisco deploy-elodisco.sh README.md LICENSE dist/$name/
          cp -r ui/dist dist/$name/ui/
          git archive HEAD dota-ocr-engine | tar -x -C dist/$name
          tar -czf dist/$name.tar.gz -C dist $name
          cp target/release/elodisco dist/elodisco-$TAG-linux-x86_64
          cd dist && sha256sum $name.tar.gz elodisco-$TAG-linux-x86_64 > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/*.tar.gz dist/elodisco-* dist/SHA256SUMS)
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Re-run of this job: replace the files of the existing release.
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            prerelease=()
            [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
            gh release create "$TAG" "${files[@]}" --title "$TAG" --generate-notes \
              --verify-tag "${prerelease[@]}"
          fi
